[project]
name = "heritage-short"
version = "0.1.0"
description = "A code pipeline that turns storyboard.json into a narrated, scored, subtitled heritage short film."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.25.0",
    "jsonschema>=4.20",
    "pillow>=10",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.scripts]
film = "pipeline.film:main"
smoke = "pipeline.smoke:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.ruff]
line-length = 110
